<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otoclinica - Agendar Consulta</title>
    <link rel="stylesheet" href="estilos/styleAgendar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="container-navbar">
        <nav class="navbar">
            <a href="index.html">
                <img class="logo" src="imagens/logo.png" alt="Otoclinica Logo">
            </a>
            <ul class="nav-links">
                <li><a href="convenios.html">Convênios</a></li>
                <li><a href="index.html#servicos">Serviços</a></li>
                <li><a href="index.html#otorrinos">Otorrinos</a></li>
                <li><a href="particulares.html">Particulares</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <section class="login-section">
    <div class="login-container">
        <div class="login-box">
            <h1>Login</h1>
            <p class="login-text">Bem-vindo de volta!!!</p>
            
            <form class="login-form">
                <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    Lembrar-me
                </label>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="login-btn">Entrar</button>
            </form>

                <div class="login-footer">
                    <p>Não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
