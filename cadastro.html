<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otoclinica - Cadastro</title>
    <link rel="stylesheet" href="estilos/styleCadastrar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="container-navbar">
        <nav class="navbar">
            <a href="index.html">
                <img class="logo" src="imagens/logo.png" alt="Otoclinica Logo">
            </a>
            <ul class="nav-links">
                <li><a href="convenios.html">Convênios</a></li>
                <li><a href="index.html#servicos">Serviços</a></li>
                <li><a href="index.html#otorrinos">Otorrinos</a></li>
                <li><a href="particulares.html">Particulares</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section class="cadastro">
        <div class="cadastro-container">
            <div class="cadastro-box">
                <h1>Criar Conta</h1>

                <form class="cadastro-form">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <div class="senha-input-wrapper">
                            <input type="password" id="senha" name="senha_hash" placeholder="••••••••" required>
                            <button type="button" class="toggle-senha" onclick="toggleSenha('senha')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmar-senha">Confirmar Senha</label>
                        <div class="senha-input-wrapper">
                            <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="••••••••" required>
                            <button type="button" class="toggle-senha" onclick="toggleSenha('confirmar-senha')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                    </div>

                    <div class="endereco-section">
                        <h3>Endereço</h3>

                        <div class="endereco-row-1">
                            <div class="form-group">
                                <label for="estado">Estado</label>
                                <input type="text" id="estado" name="estado" placeholder="Insira o Estado" required>
                            </div>

                            <div class="form-group">
                                <label for="cidade">Cidade</label>
                                <input type="text" id="cidade" name="cidade" placeholder="Insira a Cidade" required>
                            </div>
                        </div>

                        <div class="endereco-row-2">
                            <div class="form-group">
                                <label for="bairro">Bairro</label>
                                <input type="text" id="bairro" name="bairro" placeholder="Insira o Bairro" required>
                            </div>

                            <div class="form-group">
                                <label for="rua">Rua</label>
                                <input type="text" id="rua" name="rua" placeholder="Nome da Rua" required>
                            </div>
                        </div>

                        <div class="endereco-row-3">
                            <div class="form-group">
                                <label for="cep">CEP</label>
                                <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                            </div>

                            <div class="form-group">
                                <label for="numero">Número</label>
                                <input type="text" id="numero" name="numero_casa" placeholder="123" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="cadastro-btn">Criar Conta</button>
                </form>

                <div class="cadastro-footer">
                    <p>Já tem uma conta? <a href="#">Fazer login</a></p>
                </div>
            </div>
        </div>
    </section>
    <script src="toggleSenha.js"></script>
</body>
</html>
