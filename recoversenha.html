<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otoclinica - Recuperar Senha</title>
    <link rel="stylesheet" href="estilos/styleRecover.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="container-navbar">
        <nav class="navbar">
            <a href="index.html">
                <img class="logo" src="imagens/logo.png" alt="Otoclinica Logo">
            </a>
            <ul class="nav-links">
                <li><a href="convenios.html">Convênios</a></li>
                <li><a href="index.html#servico">Serviços</a></li>
                <li><a href="index.html#otorrinos">Otorrinos</a></li>
                <li><a href="particulares.html">Particulares</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="login.html" class="nav-btn nav-btn-login">Login</a></li>
                <li><a href="cadastro.html" class="nav-btn nav-btn-cadastro">Cadastrar-se</a></li>
            </ul>
        </nav>
    </header>

    <section class="recuperar-senha">
        <div class="recuperar-container">
            <div class="recuperar-box">
                <h1>Trocar Senha</h1>
                <p class="recuperar-subtitulo">Digite sua nova senha abaixo</p>

                <form class="recuperar-form">
                    <!-- NOVA SENHA -->
                    <div class="form-group">
                        <label for="nova-senha">Nova Senha</label>
                        <div class="senha-input-wrapper">
                            <input type="password" id="nova-senha" name="nova_senha" placeholder="••••••••" required>
                            <button type="button" class="toggle-senha" onclick="toggleSenha('nova-senha')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- CONFIRMAR SENHA -->
                    <div class="form-group">
                        <label for="confirmar-senha">Confirmar Senha</label>
                        <div class="senha-input-wrapper">
                            <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="••••••••" required>
                            <button type="button" class="toggle-senha" onclick="toggleSenha('confirmar-senha')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="recuperar-btn">Atualizar Senha</button>
                </form>

                <div class="recuperar-footer">
                    <p>Esqueceu seu nome? <a href="trocarnome.html">Trocar Nome</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="toggleSenha.js"></script>
</body>
</html>
